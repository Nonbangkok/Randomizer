<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <title>Secure Password Generator — Strength &amp; Entropy | Randomizer</title>
    <meta name="description" content="Cryptographically secure password generator with real-time strength analysis, entropy bits, and time-to-crack estimates. Runs locally — passwords never leave your device." />
    <link rel="canonical" href="https://randomizer.app/tools/password-generator/" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Secure Password Generator — Strength &amp; Entropy" />
    <meta property="og:description" content="Cryptographically secure password generator with strength analysis. Runs entirely in your browser." />
    <meta property="og:url" content="https://randomizer.app/tools/password-generator/" />
    <meta property="og:site_name" content="Randomizer" />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Secure Password Generator",
        "url": "https://randomizer.app/tools/password-generator/",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Cryptographically secure password generator with strength analysis. Runs entirely in your browser.",
        "featureList": ["Cryptographically random", "Real-time strength analysis", "Entropy bits display", "Time-to-crack estimate", "100% offline", "Zero server contact"],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "94",
          "bestRating": "5",
          "worstRating": "1"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('randomizer:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <div data-header></div>

      <main class="main">
        <div class="container">
          <h1>Secure Password Generator</h1>
          <p class="lead">Cryptographically random passwords with real-time strength analysis. Never leaves your device.</p>
          <div class="card" data-password-generator>
            <p>Loading generator…</p>
          </div>
          <p class="hint">Tip: press <kbd>Space</kbd> or <kbd>Enter</kbd> to regenerate.</p>
        </div>
      </main>

      <div data-footer></div>
    </div>

    <script type="module" src="/src/pages/password-generator.js"></script>
  </body>
</html>
