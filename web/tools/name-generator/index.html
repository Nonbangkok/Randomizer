<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <title>Fantasy Name Generator — Free &amp; Instant | Randomizer</title>
    <meta name="description" content="Generate fantasy, sci-fi, and RPG character names instantly. Free, private, runs in your browser. EN &amp; TH support, seeded mode for reproducible results." />
    <link rel="canonical" href="https://randomizer.app/tools/name-generator/" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fantasy Name Generator — Free &amp; Instant" />
    <meta property="og:description" content="Fantasy, sci-fi, and RPG character names in EN &amp; TH. Runs entirely in your browser." />
    <meta property="og:url" content="https://randomizer.app/tools/name-generator/" />
    <meta property="og:site_name" content="Randomizer" />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Fantasy Name Generator",
        "url": "https://randomizer.app/tools/name-generator/",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Generate fantasy, sci-fi, and RPG character names. EN/TH support, runs entirely in your browser.",
        "featureList": ["Fantasy names", "Sci-fi names", "RPG character names", "EN & TH support", "Seeded generation", "100% offline"],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "ratingCount": "128",
          "bestRating": "5",
          "worstRating": "1"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('randomizer:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header" data-header>
        <div class="site-header__inner">
          <a href="/" class="site-header__brand" aria-label="Randomizer home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" /><circle cx="8" cy="8" r="1.25" fill="currentColor" /><circle cx="16" cy="8" r="1.25" fill="currentColor" /><circle cx="8" cy="16" r="1.25" fill="currentColor" /><circle cx="16" cy="16" r="1.25" fill="currentColor" /><circle cx="12" cy="12" r="1.25" fill="currentColor" /></svg>
            <span>Randomizer</span>
          </a>
          <nav class="site-nav" aria-label="Primary">
            <a href="/tools/name-generator/" aria-current="page">Names</a>
            <a href="/tools/password-generator/">Passwords</a>
            <a href="/tools/backlog-wheel/">Backlog</a>
            <a href="/tools/challenge-generator/">Challenges</a>
            <button id="theme-toggle" class="btn btn--ghost btn--icon" type="button" aria-label="Toggle color theme" title="Toggle theme">
              <svg data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
              <svg data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
            </button>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container">
          <h1>Fantasy Name Generator</h1>
          <p class="lead">Fantasy, sci-fi, and RPG character names — EN &amp; TH. Runs entirely in your browser.</p>
          <div class="card" data-name-generator>
            <p>Loading generator…</p>
          </div>
          <p class="hint">Tip: press <kbd>Space</kbd> or <kbd>Enter</kbd> to generate again.</p>
        </div>
      </main>

      <footer class="site-footer" data-footer>
        <div class="site-footer__inner">
          <div style="display: flex; gap: var(--space-md); flex-wrap: wrap;">
            <a href="/privacy-policy.html">Privacy Policy</a>
            <a href="/terms.html">Terms of Service</a>
            <a href="/contact.html">Contact Us</a>
            <span>© <span id="footer-year">2026</span> Randomizer</span>
          </div>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/pages/name-generator.js"></script>
  </body>
</html>
