<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <title>Challenge Run Generator — Nuzlocke, Elden Ring &amp; More | Randomizer</title>
    <meta name="description" content="Generate randomized challenge run rule sets for Pokémon Nuzlockes, Elden Ring permadeath, or any game. Pick a difficulty and go." />
    <link rel="canonical" href="https://randomizer.app/tools/challenge-generator/" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Challenge Run Generator — Nuzlocke, Elden Ring &amp; More" />
    <meta property="og:description" content="Randomized challenge rule sets for hardcore playthroughs." />
    <meta property="og:url" content="https://randomizer.app/tools/challenge-generator/" />
    <meta property="og:site_name" content="Randomizer" />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Challenge Run Generator",
        "url": "https://randomizer.app/tools/challenge-generator/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Generate Nuzlocke and other game challenge rule sets at varying difficulty levels."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('randomizer:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <div data-header></div>

      <main class="main">
        <div class="container">
          <h1>Challenge Run Generator</h1>
          <p class="lead">Hardcore rule sets for Pokémon Nuzlockes, Elden Ring permadeath, or anything else.</p>
          <div class="card" data-challenge-generator>
            <p>Loading generator…</p>
          </div>
          <p class="hint">Tip: press <kbd>Space</kbd> or <kbd>Enter</kbd> to roll a new rule set.</p>
        </div>
      </main>

      <div data-footer></div>
    </div>

    <script type="module" src="/src/pages/challenge-generator.js"></script>
  </body>
</html>
