<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <title>Game Backlog Wheel — Pick What to Play Next | Randomizer</title>
    <meta name="description" content="Can't decide what to play? Add your game backlog and let the wheel pick. Free, private, runs in your browser. Your list is saved locally." />
    <link rel="canonical" href="https://randomizer.app/tools/backlog-wheel/" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Game Backlog Wheel — Pick What to Play Next" />
    <meta property="og:description" content="Random picker for your game backlog. Saved locally in your browser." />
    <meta property="og:url" content="https://randomizer.app/tools/backlog-wheel/" />
    <meta property="og:site_name" content="Randomizer" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('randomizer:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Game Backlog Wheel",
        "url": "https://randomizer.app/tools/backlog-wheel/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Random picker for your video game backlog. Saved locally.",
        "featureList": ["Random game picker", "Persistent list (localStorage)", "Spin wheel animation", "100% offline", "No account required"],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.7",
          "ratingCount": "61",
          "bestRating": "5",
          "worstRating": "1"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="site-header__inner">
          <a href="/" class="site-header__brand" aria-label="Randomizer home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" /><circle cx="8" cy="8" r="1.25" fill="currentColor" /><circle cx="16" cy="8" r="1.25" fill="currentColor" /><circle cx="8" cy="16" r="1.25" fill="currentColor" /><circle cx="16" cy="16" r="1.25" fill="currentColor" /><circle cx="12" cy="12" r="1.25" fill="currentColor" /></svg>
            <span>Randomizer</span>
          </a>
          <nav class="site-nav" aria-label="Primary">
            <a href="/tools/name-generator/">Names</a>
            <a href="/tools/password-generator/">Passwords</a>
            <a href="/tools/backlog-wheel/" aria-current="page">Backlog</a>
            <a href="/tools/challenge-generator/">Challenges</a>
            <button id="theme-toggle" class="btn btn--ghost btn--icon" type="button" aria-label="Toggle color theme" title="Toggle theme">
              <svg data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
              <svg data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
            </button>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container">
          <h1>Game Backlog Wheel</h1>
          <p class="lead">Stop picking, start playing. Drop your backlog in and spin.</p>
          <div class="card" data-backlog-wheel></div>
          <p class="hint">Tip: press <kbd>Space</kbd> or <kbd>Enter</kbd> to spin again.</p>
        </div>
      </main>

      <footer class="site-footer">
        <div class="site-footer__inner">
          <span>🔒 All processing happens in your browser.</span>
          <div style="display: flex; gap: var(--space-md); flex-wrap: wrap;">
            <a href="/privacy-policy.html">Privacy Policy</a>
            <a href="/terms.html">Terms of Service</a>
            <a href="/contact.html">Contact Us</a>
            <span>© <span id="footer-year"></span> Randomizer</span>
          </div>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/pages/backlog-wheel.js"></script>
  </body>
</html>
