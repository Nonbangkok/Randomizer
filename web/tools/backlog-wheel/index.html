<!doctype html>
<html lang="en">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2544127529898767" crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <title>Game Backlog Wheel — Pick What to Play Next | Randomizer</title>
    <meta name="description" content="Can't decide what to play? Add your game backlog and let the wheel pick. Free, private, runs in your browser. Your list is saved locally." />
    <link rel="canonical" href="https://randomizers.app/tools/backlog-wheel/" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="mask-icon" href="/logo.svg" color="#6366f1">
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Game Backlog Wheel — Pick What to Play Next" />
    <meta property="og:description" content="Random picker for your game backlog. Saved locally in your browser." />
    <meta property="og:url" content="https://randomizers.app/tools/backlog-wheel/" />
    <meta property="og:site_name" content="Randomizer" />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Game Backlog Wheel",
        "url": "https://randomizers.app/tools/backlog-wheel/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Random picker for your video game backlog. Saved locally.",
        "featureList": ["Random game picker", "Persistent list (localStorage)", "Spin wheel animation", "100% offline", "No account required"],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.7",
          "ratingCount": "61",
          "bestRating": "5",
          "worstRating": "1"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('randomizer:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <div data-header></div>

      <main class="main">
        <div class="container">
          <h1>Game Backlog Wheel</h1>
          <p class="lead">Stop picking, start playing. Drop your backlog in and spin.</p>
          <div class="card" data-backlog-wheel></div>
          <p class="hint">Tip: press <kbd>Space</kbd> or <kbd>Enter</kbd> to spin again.</p>
        </div>
      </main>

      <div data-footer></div>
    </div>

    <script type="module" src="/src/pages/backlog-wheel.ts"></script>
  </body>
</html>
