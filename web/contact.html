<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <title>Contact Us — Randomizer</title>
    <meta name="description" content="Contact Randomizer for questions, feedback, or to report a bug." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://randomizer.app/contact.html" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('randomizer:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <div data-header></div>

      <main class="main">
        <div class="container">
          <article class="policy-content">
            <h1>Contact Us</h1>
            <p>Have questions, feedback, or need to report a bug? We'd love to hear from you.</p>

            <div class="contact-box">
              <p>Email us at:</p>
              <a href="mailto:furoghost.work@gmail.com" class="contact-email">furoghost.work@gmail.com</a>
              <p class="contact-box__note">We typically respond within 24-48 hours.</p>
            </div>

            <div class="policy-content__back">
              <a href="/" class="btn btn--primary">Back to Home</a>
            </div>
          </article>
        </div>
      </main>

      <div data-footer></div>
    </div>
    <script type="module" src="/src/pages/home.ts"></script>
  </body>
</html>
